[project]
name = "image-url-download"
version = "1.0.0"
description = "Stagehand + Browserbase: extract image URLs from a page and download each through the browser's proxied connection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright",
    "python-dotenv",
    "stagehand",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
