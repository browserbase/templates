[project]
name = "exa-browserbase"
version = "0.1.0"
description = "AI-Powered Job Search and Application using Exa, Stagehand, and Browserbase"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "exa-py",
    "pydantic>=2.12,<3",
    "python-dotenv==1.2.2",
    "stagehand==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
